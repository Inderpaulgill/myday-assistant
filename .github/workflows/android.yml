name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Enable core library desugaring
        shell: bash
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            echo "Could not find $GRADLE_FILE"
            exit 1
          fi
          grep -n "compileOptions\|dependencies" "$GRADLE_FILE"
          echo "Android Gradle file found. Inspect the output above."

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myday-assistant-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
