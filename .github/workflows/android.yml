name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform files
        run: flutter create . --platforms=android

      - name: Enable core library desugaring
        shell: bash
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Detected Kotlin Gradle file"
            grep -n "compileOptions\|dependencies" "$GRADLE_FILE" || true
          else
            echo "Checking for Groovy Gradle file"
            GRADLE_FILE="android/app/build.gradle"
            if [ ! -f "$GRADLE_FILE" ]; then
              echo "Could not find the app Gradle file"
              exit 1
            fi
          fi

          python3 - "$GRADLE_FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in text and "coreLibraryDesugaringEnabled true" not in text:
              if path.suffix == ".kts":
                  block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          '''
              else:
                  block = '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
                  coreLibraryDesugaringEnabled true
              }
          '''
              marker = "android {"
              if marker not in text:
                  raise SystemExit("Could not find android block in Gradle file")
              text = text.replace(marker, marker + block, 1)

          if "desugar_jdk_libs" not in text:
              dependency = '''
          dependencies {
              coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
          }
          '''
              if path.suffix == ".kts":
                  dependency = '''
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''
              text += dependency

          path.write_text(text)
          print("Updated", path)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: myday-assistant-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
